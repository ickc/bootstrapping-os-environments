# Audit findings that were reviewed and accepted (`pixi run audit`).
#
# One table per finding, keyed exactly as the audit prints it. Both fields are
# required: `reason` says why it is fine, and `until` makes the acknowledgement
# expire so the decision is revisited rather than forgotten.
#
#   ["archived:example/project"]
#   reason = "finished software; no replacement needed"
#   until = 2027-06-01

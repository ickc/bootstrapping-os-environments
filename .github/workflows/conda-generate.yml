name: conda-generate

# Weekly, unattended refresh of the pinned conda environments:
#
#   generate  ->  publish a prerelease  ->  test the result  ->  fast-forward main, promote
#
# Nothing here waits on a person when the tests pass. The previous design
# opened a draft pull request with the default token; such a PR never gets CI
# (GitHub does not start workflows for events caused by GITHUB_TOKEN) and
# needs someone to merge it, and the locks once went two months without a
# refresh that way. Instead the installer test suite and an end-to-end
# bootstrap run in this workflow, against the exact commit that will land;
# both must pass.
#
# The generated conda-lock files are not committed: each refresh would be a
# diff of 10,000+ lines. They are published as assets of a dated release,
# conda-YYYY.MM.DD, and the commit carries only conda/locks.sha256, the pointer
# that names the release and the sha256 of every lock (plus any change to the
# CSVs and pixi manifests). A new release is cut only when the lock checksums
# differ from the current pointer's. It is created as a prerelease targeting
# the generated commit before the tests start, and the tests download from it
# exactly as an end user would: no artifacts are passed between jobs and there
# is no test-only path. It becomes a full (latest) release only once main
# points at it.
#
# When the tests fail — or main moved in the meantime — the commit stays on
# the automation branch, the prerelease stays as it is, a pull request is
# opened for a human (its body has the command that promotes the release
# after a merge), and this run fails so it gets noticed. Until then main keeps
# pointing at the last release that passed.
#
# Only a run on main lands anything. Started by hand from another branch it
# is a dry run: generate, publish and test, then delete the prerelease and its
# tag (otherwise it would fast-forward main to that branch). That is also how
# to try a CSV change before merging it. From a branch that edits a workflow,
# seed automation/conda-generate at the branch first (see CLAUDE.md): GitHub
# refuses a GITHUB_TOKEN push that changes .github/workflows/.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # A hand-edited package list is regenerated and landed right away rather
  # than on Monday. This cannot loop: the regenerated commit reaches main
  # through GITHUB_TOKEN, and GitHub starts no workflows for that.
  push:
    branches:
      - main
    paths:
      - conda/*.csv

permissions:
  contents: read

# Shared with flake-update: both land on main by fast-forward, so they must
# not overlap — whichever starts second waits, then works from the new main.
concurrency:
  group: lands-on-main
  cancel-in-progress: false

env:
  BRANCH: automation/conda-generate

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # push the automation branch, create the prerelease
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is now, not the commit that triggered the run. A
          # run that waited its turn behind the other landing workflow must
          # build on what that one landed, or its own fast-forward is refused.
          ref: ${{ github.ref }}
      - uses: prefix-dev/setup-pixi@v0.11.2

      - name: Generate conda environment files
        run: pixi run conda-generate

      # Rewrites conda/locks.sha256 for a new tag only when the lock checksums
      # changed, and prints that tag; prints nothing otherwise.
      - name: Point at a new release if the locks changed
        id: pointer
        run: |
          set -euo pipefail
          tag="$(pixi run --quiet conda-locks-pointer -- --repo "${GH_REPO}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "new release: ${tag:-none (the locks are the pinned ones)}"

      # The locks themselves are gitignored, so this commits the tracked
      # files only: CSVs, pixi manifests, the pointer.
      - name: Commit to the automation branch
        id: commit
        run: |
          set -euo pipefail
          git add conda
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to land."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: regenerate conda environment files"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish the locks as a prerelease
        id: release
        if: steps.commit.outputs.sha != '' && steps.pointer.outputs.tag != ''
        env:
          TAG: ${{ steps.pointer.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/assets"
          pixi run --quiet conda-locks-stage -- "${assets}"
          {
            echo "conda-lock files pinned by \`conda/locks.sha256\` at ${SHA}, generated by ${RUN_URL}."
            echo
            echo "The \`<stem>-pixi.lock\` files are the pixi solves they were converted from, attached for provenance only."
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" "${assets}"/* \
            --target "${SHA}" --prerelease --latest=false \
            --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  # The same jobs as a push to main, run against the generated commit. The
  # smoke job creates the `system` env from the new lock — downloaded from the
  # prerelease through the commit's pointer — on all four platforms and checks
  # that its executables can load.
  test:
    needs: generate
    if: needs.generate.outputs.sha != ''
    uses: ./.github/workflows/test-installers.yml
    with:
      ref: ${{ needs.generate.outputs.sha }}

  # bootstrap.sh from the generated commit: env.sh, the pointer and the envoy
  # clone all at that commit, the system lock from the release it names, on
  # all four platforms, then the smoke test. It catches what the installer
  # tests cannot, such as a lock that no longer provides a tool a later
  # bootstrap stage or the smoke test needs.
  test-bootstrap:
    needs: generate
    if: needs.generate.outputs.sha != ''
    uses: ./.github/workflows/test-bootstrap.yml
    with:
      ref: ${{ needs.generate.outputs.sha }}

  land:
    needs: [generate, test, test-bootstrap]
    if: always() && needs.generate.result == 'success' && needs.generate.outputs.sha != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # fast-forward main, delete the automation branch, promote the release
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.generate.outputs.sha }}
      TAG: ${{ needs.generate.outputs.tag }}
    steps:
      - name: Fast-forward main
        id: land
        if: needs.test.result == 'success' && needs.test-bootstrap.result == 'success'
        run: |
          # Fast-forward only (force=false): if main moved while the tests
          # ran, the update is rejected and the change goes to a pull request.
          if gh api --method PATCH "repos/${GH_REPO}/git/refs/heads/main" -f sha="${SHA}" -F force=false; then
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH}"
            echo "landed=true" >> "${GITHUB_OUTPUT}"
          fi

      # main now points at the release, so it is the tested, current one.
      - name: Promote the release
        if: steps.land.outputs.landed == 'true' && env.TAG != ''
        run: gh release edit "${TAG}" --prerelease=false --latest

      - name: Hand over to a human
        if: steps.land.outputs.landed != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ needs.test.result }}
          BOOTSTRAP: ${{ needs.test-bootstrap.result }}
        run: |
          set -euo pipefail
          open="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -z "${open}" ]]; then
            {
              echo "The weekly \`conda-generate\` run could not land this on its own (tests: ${TESTS}, bootstrap: ${BOOTSTRAP})."
              echo
              echo "Pull requests opened by this workflow get no CI of their own; the results are in ${RUN_URL}."
              if [[ -n "${TAG}" ]]; then
                echo
                echo "\`conda/locks.sha256\` here points at the prerelease ${TAG}. After merging, promote it:"
                echo
                echo '```'
                echo "gh release edit ${TAG} -R ${GH_REPO} --prerelease=false --latest"
                echo '```'
              fi
            } > body.md
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: regenerate conda environment files" --body-file body.md
          fi
          echo "::error::Regenerated conda files were not landed (tests: ${TESTS}, bootstrap: ${BOOTSTRAP}); see the pull request for ${BRANCH}."
          exit 1

  # A dry run leaves nothing behind on the Releases page, whatever the tests
  # said. (The automation branch it pushed stays, as before; its pointer then
  # names a release that no longer exists.)
  discard-release:
    needs: [generate, test, test-bootstrap]
    if: always() && needs.generate.outputs.tag != '' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # delete the dry run's prerelease and tag
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.generate.outputs.tag }}
    steps:
      - name: Delete the dry run's prerelease and its tag
        run: gh release delete "${TAG}" --cleanup-tag --yes
